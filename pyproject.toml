[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonmend"
version = "1.0.0"
description = "Mend broken JSON from LLMs/agents: extract, clean, repair truncation, stream partial JSON, and coerce to a schema. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "gitstq" }]
keywords = [
    "json",
    "json-repair",
    "llm",
    "ai-agent",
    "structured-output",
    "partial-json",
    "jsonl",
    "tolerant-parser",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
jsonmend = "jsonmend.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/jsonmend"
Repository = "https://github.com/gitstq/jsonmend"
Issues = "https://github.com/gitstq/jsonmend/issues"
Changelog = "https://github.com/gitstq/jsonmend/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jsonmend = ["py.typed"]
